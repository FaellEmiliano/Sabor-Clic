name: Gerar documentação integrada

on:
  push:
    branches: [main]
    paths:
      - '.docbuild/READY'

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependência
        run: pip install python-docx

      - name: Montar documentação
        run: |
          cat .docbuild/part*.md > "Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V2_Integrada.md"
          python "Documentação/gerar_documentacao_integrada.py"

      - name: Publicar arquivos gerados
        run: |
          rm -rf .docbuild
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V2_Integrada.md" "Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V2_Integrada.docx" .docbuild
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: gera documentação integrada do 3 bimestre"
          git push
