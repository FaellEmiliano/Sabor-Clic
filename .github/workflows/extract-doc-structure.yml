name: Extrair estrutura da documentacao antiga
on:
  push:
    branches: [main]
    paths:
      - '.docextract/TRIGGER'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Extrair estrutura
        run: |
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          p = Path('Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_Revisada.docx')
          d = Document(p)
          out=[]
          for i,par in enumerate(d.paragraphs):
              t=par.text.strip()
              if t:
                  out.append(f'P{i:04d}\tSTYLE={par.style.name}\t{t}')
          for ti,table in enumerate(d.tables):
              out.append(f'\nTABLE {ti}')
              for ri,row in enumerate(table.rows):
                  vals=[c.text.replace('\n',' | ').strip() for c in row.cells]
                  out.append(f'R{ri}: ' + ' || '.join(vals))
          Path('.docextract/old_structure.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Publicar extracao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .docextract/old_structure.txt
          git commit -m 'chore(docs): extrai estrutura da documentacao antiga' || exit 0
          git push
