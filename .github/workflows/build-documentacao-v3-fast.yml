name: Gerar documentacao V3 rapido
on:
  push:
    branches: [main]
    paths:
      - '.docv3fast/TRIGGER'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python 'Documentação/refazer_documentacao_sobre_base_antiga.py'
      - run: |
          rm -rf .docv3fast
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.docx' .docv3fast
          git commit -m 'docs: aplica revisao integrada sobre documento original' || exit 0
          git push
