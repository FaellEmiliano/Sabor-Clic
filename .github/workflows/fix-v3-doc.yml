name: Corrigir documentacao V3
on:
  push:
    branches: [main]
    paths:
      - '.fixv3/TRIGGER'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils
      - name: Gerar DOCX corrigido
        run: python 'Documentação/gerar_v3_corrigida.py'
      - name: Gerar PDF e validar paginacao
        run: |
          mkdir -p /tmp/fixv3
          libreoffice --headless --convert-to pdf --outdir /tmp/fixv3 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.docx'
          pages=$(pdfinfo /tmp/fixv3/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages=$pages"
          test "$pages" = "26"
          cp /tmp/fixv3/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.pdf 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.pdf'
      - name: Publicar versao corrigida
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.docx' 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.pdf'
          git commit -m 'docs: corrige paginacao da documentacao V3' || exit 0
          git push
