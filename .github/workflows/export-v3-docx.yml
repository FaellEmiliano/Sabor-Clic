name: Exportar V3 DOCX
on:
  push:
    branches: [main]
    paths:
      - '.exportdocx/TRIGGER'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Documentacao-Sabor-Clic-V3-DOCX
          path: 'Documentação/Documentacao_Sabor_e_Clic_3_Bimestre_V3_Base_Revisada.docx'
          if-no-files-found: error
